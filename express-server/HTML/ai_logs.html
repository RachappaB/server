<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Productivity Logs</title>

<style>
:root {
    --primary:#4a90e2;
    --danger:#e74c3c;
    --success:#27ae60;
    --dark:#2c3e50;
    --light:#f4f7f6;
}

body {
    font-family: Segoe UI, sans-serif;
    background: var(--light);
    margin: 0;
    padding: 20px;
    color: var(--dark);
}

.container {
    max-width: 1000px;
    margin: auto;
}

header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 6px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.controls {
    display:flex;
    gap:10px;
}

input[type=date] {
    padding:8px;
    border-radius:6px;
    border:1px solid #ddd;
}

button {
    padding:8px 16px;
    border:none;
    border-radius:6px;
    background:var(--primary);
    color:white;
    cursor:pointer;
}

button:hover {opacity:.85}

.log-card {
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 4px rgba(0,0,0,.05);
    border-left:5px solid var(--primary);
}

.log-header {
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #eee;
    padding-bottom:10px;
    margin-bottom:10px;
}

.bucket {font-weight:600;color:#7f8c8d}
.date {font-size:.85rem;color:#95a5a6}

.section {margin-top:10px}

.label {
    font-size:.75rem;
    letter-spacing:.05em;
    font-weight:600;
    text-transform:uppercase;
    color:#7f8c8d;
}

.bad-review {
    color:var(--danger);
    font-style:italic;
}

.suggestion {
    background:#ebfaf0;
    color:var(--success);
    padding:10px;
    border-radius:6px;
}

.problem-tag {
    display:inline-block;
    background:#eee;
    padding:4px 10px;
    border-radius:6px;
    font-size:.8rem;
}

.meta-box {
    background:#f7f9fb;
    padding:10px;
    border-radius:8px;
    font-size:.85rem;
}

.topic-chip {
    display:inline-block;
    background:#e8f0fe;
    color:#2f5fd7;
    padding:4px 8px;
    border-radius:6px;
    font-size:.75rem;
    margin:3px;
}

#loading {
    text-align:center;
    display:none;
    padding:20px;
}

.no-data {
    text-align:center;
    color:#aaa;
    padding:40px;
}
</style>
</head>

<body>

<div class="container">

<header>
<h2>🤖 AI Productivity Auditor</h2>

<div class="controls">
<input type="date" id="dateFilter">
<button onclick="fetchLogs()">Filter</button>
<button onclick="resetLogs()" style="background:#95a5a6">All</button>
</div>
</header>

<div id="loading">Analyzing logs...</div>
<div id="logsContainer"></div>

</div>

<script>
const API_BASE = "https://data.sunita.space/api/gemini";

const logsContainer = document.getElementById("logsContainer");
const loading = document.getElementById("loading");

window.onload = fetchLogs;

// ---------- API ----------

async function fetchLogs() {

    const dateVal = document.getElementById("dateFilter").value;
    const url = dateVal ? `${API_BASE}/logs/${dateVal}` : `${API_BASE}/logs`;

    loading.style.display = "block";
    logsContainer.innerHTML = "";

    try {

        const res = await fetch(url);
        const data = await res.json();

        if (data.ok && data.logs.length) {
            renderLogs(data.logs);
        } else {
            logsContainer.innerHTML = `<div class="no-data">No analysis data found.</div>`;
        }

    } catch (err) {

        console.error(err);
        logsContainer.innerHTML = `<div class="no-data" style="color:red">Server connection failed</div>`;

    } finally {
        loading.style.display = "none";
    }
}

function resetLogs() {
    document.getElementById("dateFilter").value = "";
    fetchLogs();
}

// ---------- UI RENDER ----------

function renderLogs(logs) {

    logs.forEach(log => {

        const card = document.createElement("div");
        card.className = "log-card";

        // bucket -> time
        const minutes = log.bucket_index * 15;
        const hour = Math.floor(minutes / 60);
        const min = minutes % 60;
        const timeStr = `${String(hour).padStart(2,"0")}:${String(min).padStart(2,"0")}`;

        // Topics chips
        let topicsHTML = "";
        if (Array.isArray(log.topics_to_address)) {
            topicsHTML = log.topics_to_address
                .map(t => `<span class="topic-chip">${t}</span>`)
                .join("");
        }

        card.innerHTML = `

        <div class="log-header">
            <span class="bucket">Bucket ${log.bucket_index} (~${timeStr})</span>
            <span class="date">${log.activity_date}</span>
        </div>

        <div class="section">
            <span class="label">Critique</span>
            <p class="bad-review">${safe(log.bad_review)}</p>
        </div>

        <div class="section">
            <span class="label">Problem</span>
            <div class="problem-tag">${safe(log.problem)}</div>
        </div>

        <div class="section">
            <span class="label">Suggestion</span>
            <div class="suggestion">${safe(log.suggestion)}</div>
        </div>

        <div class="section">
            <span class="label">Guidance</span>
            <p>${safe(log.guidance)}</p>
        </div>

        <div class="section meta-box">
            <b>Motion:</b> ${safe(log.motion)} <br>
            <b>Health:</b> ${safe(log.health)} <br>
            <b>Roadmap:</b> ${safe(log.roadmap)}
        </div>

        <div class="section">
            <span class="label">Topics To Address</span>
            <div>${topicsHTML || "<i>No topics</i>"}</div>
        </div>

        <div style="text-align:right;font-size:.8rem;color:#999;margin-top:10px">
            Followed Previous Advice:
            ${log.followed_previous_advice ? "✅ YES" : "❌ NO"}
        </div>
        `;

        logsContainer.appendChild(card);
    });
}

// ---------- Helpers ----------

function safe(val) {
    return val ? val : "<i>Not available</i>";
}
</script>

</body>
</html>
