
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitBand Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
    }

    h2 {
      color: #38bdf8;
      margin-top: 30px;
    }

    .card {
      background: #020617;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    input, select, button {
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin: 6px 0;
      width: 100%;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border-bottom: 1px solid #334155;
      padding: 8px;
      text-align: left;
    }

    th {
      color: #7dd3fc;
    }

    .danger {
      background: #dc2626;
    }

    .danger:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body>

<h1>📟 FitBand Control Panel</h1>

<!-- ================= ALARM SECTION ================= -->

<div class="card">
  <h2>⏰ Alarm Settings</h2>

  <label>Alarm Time</label>
  <input type="time" id="alarmTime">

  <label>Vibration Duration (ms)</label>
  <input type="number" id="alarmVibrate" value="3000">

  <label>Repeat Daily</label>
  <select id="alarmRepeat">
    <option value="false">One Time</option>
    <option value="true">Repeat Daily</option>
  </select>

  <button onclick="createAlarm()">Create Alarm</button>
</div>


<!-- ================= NOTIFICATION SECTION ================= -->

<div class="card">
  <h2>🔔 Instant Notification</h2>

  <label>Vibration Duration (ms)</label>
  <input type="number" id="notifyVibrate" value="1500">

  <button onclick="sendNotification()">Send Notification Now</button>
</div>


<!-- ================= MOTION DATA SECTION ================= -->

<div class="card">
  <h2>📊 Motion Data (Last 20)</h2>

  <button onclick="loadMotionData()">Refresh Data</button>

  <table id="motionTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Bucket</th>
        <th>Motion Values</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>


<script>

const API = "https://data.sunita.space/api/fitband";

// ================= CREATE ALARM =================

async function createAlarm() {

  const time = document.getElementById("alarmTime").value;
  const vibrate = document.getElementById("alarmVibrate").value;
  const repeat = document.getElementById("alarmRepeat").value === "true";

  if (!time) {
    alert("Select time");
    return;
  }

  const res = await fetch(API + "/alarm", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      alarm_time: time,
      vibrate_ms: vibrate,
      repeat: repeat
    })
  });

  const data = await res.json();

  if (data.ok) {
    alert("Alarm created");
  } else {
    alert("Failed to create alarm");
  }
}


// ================= SEND NOTIFICATION =================

async function sendNotification() {

  const vibrate = document.getElementById("notifyVibrate").value;

  const res = await fetch(API + "/notification", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ vibrate_ms: vibrate })
  });

  const data = await res.json();

  if (data.ok) {
    alert("Notification sent");
  } else {
    alert("Failed");
  }
}


// ================= LOAD MOTION DATA =================

async function loadMotionData() {

  const res = await fetch(API + "/motion");
  const rows = await res.json();

  const tbody = document.querySelector("#motionTable tbody");
  tbody.innerHTML = "";

  rows.forEach(r => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${r.id}</td>
      <td>${r.bucket}</td>
      <td>${r.motion_data.join(",")}</td>
      <td>${new Date(r.created_at).toLocaleString()}</td>
    `;

    tbody.appendChild(tr);
  });
}

</script>

</body>
</html>
